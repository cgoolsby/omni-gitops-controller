name: Helm Lint

on:
  push:
    paths:
      - "charts/**"
  pull_request:
    paths:
      - "charts/**"

jobs:
  lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: latest

      - name: Lint chart
        run: helm lint charts/omni-gitops-controller/

      - name: Template chart (spot-check rendering)
        run: |
          helm template omni-gitops-controller charts/omni-gitops-controller/ \
            --set omni.endpoint=https://omni.example.com \
            --set omni.token=fake-token \
            | kubectl apply --dry-run=client --validate=false -f -
        env:
          KUBECONFIG: /dev/null
