---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: machines.omni.gitops.dev
spec:
  group: omni.gitops.dev
  names:
    kind: Machine
    listKind: MachineList
    plural: machines
    singular: machine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterName
      name: Cluster
      type: string
    - jsonPath: .spec.machineSetID
      name: Set
      type: string
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Machine owns all per-machine Omni state for one machine bound to a cluster:
          its bind/unbind to the Omni machine set, its config patches and kernel args,
          and its drift-remediation reboots. It is reconciled by the MachineReconciler
          and owned (controller reference) by the OmniCluster that created it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MachineSpec is the desired per-machine Omni state. A Machine is created,
              updated and deleted by the OmniClusterReconciler to express "this cluster
              needs this machine bound to this set with this config" — the
              Deployment→ReplicaSet→Pod / Cluster-API Cluster→MachineSet→Machine shape.
              The MachineReconciler converges a single machine's Omni state onto this spec.

              metadata.name of a Machine is the raw Omni machine UUID: globally unique and
              matching Omni's own identity, so there is no invented naming scheme to map.
            properties:
              clusterName:
                description: ClusterName is the Omni cluster this machine belongs
                  to.
                type: string
              configPatches:
                description: ConfigPatches are the Talos machine config patches applied
                  to this machine.
                items:
                  description: ConfigPatch is a Talos machine config patch applied
                    via Omni's ConfigPatch resource.
                  properties:
                    inline:
                      description: Inline is the patch content in Talos machine config
                        YAML/JSON format.
                      x-kubernetes-preserve-unknown-fields: true
                    name:
                      description: Name is a unique identifier for this patch within
                        the machine set.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              kernelArgs:
                description: |-
                  KernelArgs are extra kernel arguments applied to this machine at the
                  schematic level (active during maintenance/install boot).
                items:
                  type: string
                type: array
              machineSetID:
                description: |-
                  MachineSetID is the Omni-side machine-set ID this machine is bound to
                  (e.g. "<cluster>-control-planes" or "<cluster>-<worker>").
                type: string
              managementAddress:
                description: |-
                  ManagementAddress is the machine's management address, meaningful only
                  alongside a RebootRequestedAt — it is the address the reboot RPC targets.
                type: string
              rebootRequestedAt:
                description: |-
                  RebootRequestedAt requests a drift-remediation reboot of this machine.
                  A reboot is "owed" iff RebootRequestedAt is newer than
                  Status.LastRebootTime; nil means no reboot is owed. The requester never
                  has to clear this field — stamping Status.LastRebootTime after the reboot
                  RPC runs naturally makes the reboot no longer owed.
                format: date-time
                type: string
              role:
                description: Role is the machine's role within the set.
                enum:
                - control-plane
                - worker
                type: string
            required:
            - clusterName
            - machineSetID
            - role
            type: object
          status:
            description: MachineStatus is the observed per-machine state.
            properties:
              conditions:
                description: Conditions is the standard Kubernetes condition set.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              failureMessage:
                description: FailureMessage is a human-readable error description.
                type: string
              failureReason:
                description: FailureReason is a short machine-readable token when
                  phase is Failed.
                type: string
              lastRebootTime:
                description: |-
                  LastRebootTime records when the reboot RPC last ran for this machine.
                  It is stamped only after the RPC returns, so it is never persisted without
                  a matching reboot attempt. Used both to make a requested reboot no longer
                  owed and to enforce the cross-machine reboot cooldown.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last processed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: Phase is a short lifecycle token (Binding, Ready, Rebooting,
                  Failed).
                type: string
              ready:
                description: Ready is true when the machine is bound and its config
                  is applied.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
