apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omni-gitops-controller.name" . }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "omni-gitops-controller.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "omni-gitops-controller.name" . }}
    spec:
      serviceAccountName: {{ include "omni-gitops-controller.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.leaderElect }}
            - --kubeconfig-namespace={{ .Values.kubeconfigNamespace }}
            {{- if .Values.argoCDClusters }}
            - --argocd-clusters=true
            {{- end }}
          env:
            - name: OMNI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "omni-gitops-controller.credentialsSecret" . }}
                  key: endpoint
            - name: OMNI_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "omni-gitops-controller.credentialsSecret" . }}
                  key: token
          {{- if .Values.omni.caCert }}
            - name: SSL_CERT_FILE
              value: /etc/omni-ca/ca.crt
          volumeMounts:
            - name: omni-ca
              mountPath: /etc/omni-ca
              readOnly: true
          {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.omni.caCert }}
      volumes:
        - name: omni-ca
          configMap:
            name: {{ include "omni-gitops-controller.name" . }}-ca
      {{- end }}
