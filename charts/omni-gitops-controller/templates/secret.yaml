{{- if and (not .Values.omni.existingSecret) (or .Values.omni.endpoint .Values.omni.token) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omni-gitops-controller.name" . }}-credentials
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  endpoint: {{ required "omni.endpoint is required" .Values.omni.endpoint | quote }}
  token: {{ required "omni.token is required" .Values.omni.token | quote }}
{{- end }}
