---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: omniclusters.omni.gitops.dev
spec:
  group: omni.gitops.dev
  names:
    kind: OmniCluster
    listKind: OmniClusterList
    plural: omniclusters
    singular: omnicluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.kubernetesVersion
      name: K8s
      type: string
    - jsonPath: .spec.talosVersion
      name: Talos
      type: string
    - jsonPath: .spec.controlPlane.replicas
      name: CP
      type: integer
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OmniCluster declares the desired state of a Talos Kubernetes cluster managed by Omni.
          The controller reconciles this resource into the full set of Omni resources:
          Cluster, MachineSet(s), MachineSetNode(s), and ConfigPatch(es).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OmniClusterSpec is the desired state of a cluster managed
              by Omni.
            properties:
              controlPlane:
                description: ControlPlane describes the control-plane machine set.
                properties:
                  configPatches:
                    description: ConfigPatches are Talos machine config patches applied
                      to each machine in the set.
                    items:
                      description: ConfigPatch is a Talos machine config patch applied
                        via Omni's ConfigPatch resource.
                      properties:
                        inline:
                          description: Inline is the patch content in Talos machine
                            config YAML/JSON format.
                          x-kubernetes-preserve-unknown-fields: true
                        name:
                          description: Name is a unique identifier for this patch
                            within the machine set.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  machineSelector:
                    description: |-
                      MachineSelector selects available Omni machines by label.
                      Matched against MachineStatuses.omni.sidero.dev labels
                      (e.g. omni.sidero.dev/mem, omni.sidero.dev/cpu, omni.sidero.dev/platform).
                      The controller always adds omni.sidero.dev/available to the query.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  replicas:
                    default: 1
                    description: Replicas is the desired number of machines in this
                      set.
                    format: int32
                    type: integer
                required:
                - machineSelector
                type: object
              kubernetesVersion:
                description: KubernetesVersion is the target Kubernetes version (e.g.
                  "1.31.0").
                type: string
              talosVersion:
                description: TalosVersion is the target Talos Linux version (e.g.
                  "v1.13.0").
                type: string
              workers:
                description: Workers describes additional worker machine sets. Empty
                  for single-node clusters.
                items:
                  description: WorkerMachineSetSpec is a named worker machine set.
                  properties:
                    configPatches:
                      description: ConfigPatches are Talos machine config patches
                        applied to each machine in the set.
                      items:
                        description: ConfigPatch is a Talos machine config patch applied
                          via Omni's ConfigPatch resource.
                        properties:
                          inline:
                            description: Inline is the patch content in Talos machine
                              config YAML/JSON format.
                            x-kubernetes-preserve-unknown-fields: true
                          name:
                            description: Name is a unique identifier for this patch
                              within the machine set.
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                    machineSelector:
                      description: |-
                        MachineSelector selects available Omni machines by label.
                        Matched against MachineStatuses.omni.sidero.dev labels
                        (e.g. omni.sidero.dev/mem, omni.sidero.dev/cpu, omni.sidero.dev/platform).
                        The controller always adds omni.sidero.dev/available to the query.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                    name:
                      description: |-
                        Name identifies this worker set. Used as the Omni MachineSet suffix
                        (resulting ID: <cluster>-<name>).
                      type: string
                    replicas:
                      default: 1
                      description: Replicas is the desired number of machines in this
                        set.
                      format: int32
                      type: integer
                  required:
                  - machineSelector
                  - name
                  type: object
                type: array
            required:
            - controlPlane
            - kubernetesVersion
            - talosVersion
            type: object
          status:
            description: OmniClusterStatus is the observed state of the cluster.
            properties:
              allocatedMachines:
                additionalProperties:
                  items:
                    type: string
                  type: array
                description: |-
                  AllocatedMachines records the Omni machine UUIDs bound to this cluster,
                  keyed by machine-set ID. Used to detect drift on re-reconcile.
                type: object
              conditions:
                description: Conditions is the standard Kubernetes condition set.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              failureMessage:
                description: FailureMessage is a human-readable error description.
                type: string
              failureReason:
                description: FailureReason is a short machine-readable token when
                  phase is Failed.
                type: string
              phase:
                description: Phase mirrors the Omni ClusterStatus phase (ScalingUp,
                  Running, Destroying, etc.).
                type: string
              ready:
                description: Ready is true when the Omni cluster is Running and the
                  Kubernetes API is reachable.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
