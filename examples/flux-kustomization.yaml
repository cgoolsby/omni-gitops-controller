# After OmniCluster reaches Ready=true, point a Flux Kustomization at it.
# The controller writes the kubeconfig to flux-system/<cluster-name>-kubeconfig.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ha-cluster-example-global
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/ha-cluster-example/global
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  kubeConfig:
    secretRef:
      name: ha-cluster-example-kubeconfig   # written by omni-gitops-controller
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ha-cluster-example-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/ha-cluster-example/system
  prune: true
  dependsOn:
    - name: ha-cluster-example-global
  sourceRef:
    kind: GitRepository
    name: flux-system
  kubeConfig:
    secretRef:
      name: ha-cluster-example-kubeconfig
