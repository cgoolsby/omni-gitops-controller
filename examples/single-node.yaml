# Single-node Talos cluster provisioned through Omni.
# One control plane machine, no separate workers.
# The control plane also schedules workloads (taint removed by default in Omni).
apiVersion: omni.gitops.dev/v1alpha1
kind: OmniCluster
metadata:
  name: single-node-example
  namespace: omni-gitops-system
spec:
  kubernetesVersion: "1.31.0"
  talosVersion: "v1.9.0"
  controlPlane:
    replicas: 1
    machineSelector:
      matchLabels: {}   # Any available machine. Add labels to constrain.
